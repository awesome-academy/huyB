# ============================================================
# DEV profile  —  active khi SPRING_PROFILES_ACTIVE=dev  (mặc định)
# File này KHÔNG được đưa lên môi trường production.
# ============================================================

# ========================
# DataSource — MySQL local
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/booking_tours?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Aa@123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# ========================
# Flyway — bật migration và hiển thị log khi dev
# ========================
spring.flyway.enabled=true
spring.flyway.out-of-order=false

# ========================
# JPA / Hibernate — verbose cho debug
# ========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Thymeleaf — tắt cache để hot-reload template
# ========================
spring.thymeleaf.cache=false

# ========================
# OAuth2 — Google
# Credentials được đọc từ file .env ở root project (gitignored).
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Import file .env từ root project (optional: không lỗi nếu không có file)
spring.config.import=optional:file:.env[.properties]

# ========================
# OAuth2 — Facebook
# ========================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ========================
# OAuth2 — Twitter (OAuth 2.0, custom provider)
# ========================
spring.security.oauth2.client.registration.twitter.client-id=${TWITTER_CLIENT_ID}
spring.security.oauth2.client.registration.twitter.client-secret=${TWITTER_CLIENT_SECRET}
spring.security.oauth2.client.registration.twitter.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.scope=tweet.read,users.read,offline.access
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=data

# ========================
# Springdoc / Swagger UI — chỉ bật ở dev
# ========================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.model-and-view-allowed=true

# ========================
# JWT - secret dành riêng cho dev (hardcode, KHÔNG dùng ở prod)
# Base64-encoded key >= 256 bit
# cookie-secure=false vì localhost chạy HTTP
# ========================
app.jwt.secret=c3VuQm9va2luZ1RvdXJzU2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnQyMDI2IQ==
app.jwt.cookie-secure=false

# ========================
# ActiveMQ — embedded broker (in-memory, dev only)
# ========================
spring.activemq.broker-url=vm://localhost?broker.persistent=false
spring.activemq.in-memory=true

# ========================
# RabbitMQ — Docker local (dev only)
# Khởi động: docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:3-management
# ========================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========================
# Logging - verbose để dễ debug
# ========================
logging.level.com.sunasterisk.bookingtours=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=DEBUG
