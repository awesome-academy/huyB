<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(pageTitle='Tours', content=~{::pageContent}, extraHead=~{}, extraScripts=~{})}">
<body>
<th:block th:fragment="pageContent">

    <!-- ============================================================ -->
    <!-- Page header                                                   -->
    <!-- ============================================================ -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i class="bi bi-map-fill me-2 text-primary"></i>Explore Tours
        </h3>
        <span class="text-muted small">
            <strong th:text="${tourPage.totalElements}">0</strong> tour(s) found
        </span>
    </div>

    <!-- ============================================================ -->
    <!-- Search + Category filter bar                                  -->
    <!-- ============================================================ -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/tours}" method="get" class="row g-2 align-items-end">
                <!-- Keyword search -->
                <div class="col-md-5">
                    <label class="form-label fw-semibold small text-muted mb-1">
                        <i class="bi bi-search me-1"></i>Search
                    </label>
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Tour title or destination…"
                           th:value="${keyword}"/>
                </div>

                <!-- Category filter -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold small text-muted mb-1">
                        <i class="bi bi-tag me-1"></i>Category
                    </label>
                    <select name="categoryId" class="form-select">
                        <option value="">All Categories</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${cat.id == categoryId}">Category</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-funnel me-1"></i>Filter
                    </button>
                    <a th:href="@{/tours}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Active filters display -->
    <div class="mb-3 d-flex flex-wrap gap-2 align-items-center"
         th:if="${(keyword != null and !keyword.isEmpty()) or categoryId != null}">
        <span class="text-muted small fw-semibold">Active filters:</span>
        <span th:if="${keyword != null and !keyword.isEmpty()}"
              class="badge rounded-pill bg-primary bg-opacity-10 text-primary border border-primary">
            <i class="bi bi-search me-1"></i>
            <span th:text="${keyword}"></span>
        </span>
        <th:block th:if="${categoryId != null}">
            <th:block th:each="cat : ${categories}">
                <span th:if="${cat.id == categoryId}"
                      class="badge rounded-pill bg-success bg-opacity-10 text-success border border-success">
                    <i class="bi bi-tag me-1"></i>
                    <span th:text="${cat.name}"></span>
                </span>
            </th:block>
        </th:block>
    </div>

    <!-- ============================================================ -->
    <!-- Tour Grid                                                     -->
    <!-- ============================================================ -->

    <!-- Empty state -->
    <div th:if="${tourPage.empty}" class="text-center py-5">
        <i class="bi bi-binoculars display-4 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No tours found</h5>
        <p class="text-muted small">Try adjusting your search or filter criteria.</p>
        <a th:href="@{/tours}" class="btn btn-outline-primary mt-2">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset filters
        </a>
    </div>

    <!-- Tour cards -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${tourPage.empty}">
        <div class="col" th:each="tour : ${tourPage.content}">
            <div class="card h-100 border-0 shadow-sm tour-card">

                <!-- Thumbnail -->
                <div class="position-relative">
                    <img th:if="${tour.thumbnailUrl != null}"
                         th:src="${tour.thumbnailUrl}"
                         class="card-img-top"
                         alt="Tour thumbnail"
                         style="height:200px;object-fit:cover;"/>
                    <!-- Placeholder when no thumbnail -->
                    <div th:unless="${tour.thumbnailUrl != null}"
                         class="card-img-top bg-light d-flex align-items-center justify-content-center"
                         style="height:200px;">
                        <i class="bi bi-image text-muted" style="font-size:3rem;"></i>
                    </div>

                    <!-- Category badge overlay -->
                    <span th:if="${tour.category != null}"
                          class="position-absolute top-0 start-0 m-2 badge bg-primary bg-opacity-90"
                          th:text="${tour.category.name}">Category</span>
                </div>

                <div class="card-body d-flex flex-column">
                    <!-- Title -->
                    <h5 class="card-title fw-bold mb-1 lh-sm">
                        <span th:text="${tour.title}">Tour Title</span>
                    </h5>

                    <!-- Destination -->
                    <p class="text-muted small mb-2">
                        <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                        <span th:text="${tour.destination}">Destination</span>
                    </p>

                    <!-- Star Rating (avg_rating) -->
                    <div class="d-flex align-items-center mb-2"
                         th:with="score=${tour.avgRating != null ? tour.avgRating.doubleValue() : 0.0}">
                        <div class="me-2">
                            <i th:class="${score >= 1 ? 'bi bi-star-fill text-warning' : (score >= 0.5 ? 'bi bi-star-half text-warning' : 'bi bi-star text-warning')}"></i>
                            <i th:class="${score >= 2 ? 'bi bi-star-fill text-warning' : (score >= 1.5 ? 'bi bi-star-half text-warning' : 'bi bi-star text-warning')}"></i>
                            <i th:class="${score >= 3 ? 'bi bi-star-fill text-warning' : (score >= 2.5 ? 'bi bi-star-half text-warning' : 'bi bi-star text-warning')}"></i>
                            <i th:class="${score >= 4 ? 'bi bi-star-fill text-warning' : (score >= 3.5 ? 'bi bi-star-half text-warning' : 'bi bi-star text-warning')}"></i>
                            <i th:class="${score >= 5 ? 'bi bi-star-fill text-warning' : (score >= 4.5 ? 'bi bi-star-half text-warning' : 'bi bi-star text-warning')}"></i>
                        </div>
                        <span class="fw-semibold small text-muted"
                              th:text="${score > 0 ? #numbers.formatDecimal(score, 1, 1) : 'No rating'}">0.0</span>
                    </div>

                    <!-- Tour meta info -->
                    <div class="d-flex flex-wrap gap-2 mb-3 text-muted small">
                        <span>
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${tour.durationDays}">1</span> day(s)
                        </span>
                        <span th:if="${tour.departureDate != null}">
                            <i class="bi bi-calendar3 me-1"></i>
                            <span th:text="${#temporals.format(tour.departureDate, 'dd/MM/yyyy')}">01/01/2025</span>
                        </span>
                        <span>
                            <i class="bi bi-people me-1"></i>
                            Max <span th:text="${tour.maxParticipants}">20</span>
                        </span>
                    </div>

                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <!-- Price -->
                        <div>
                            <span class="text-muted small d-block">From</span>
                            <span class="fw-bold text-primary fs-5">
                                <span th:text="${#numbers.formatDecimal(tour.price, 1, 'COMMA', 0, 'POINT')}">0</span> ₫
                            </span>
                        </div>
                        <!-- View detail button -->
                        <a th:href="@{/tours/{id}(id=${tour.id})}"
                           class="btn btn-primary btn-sm">
                            <i class="bi bi-eye me-1"></i>View Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- Pagination                                                    -->
    <!-- ============================================================ -->
    <th:block th:replace="~{layout/pagination :: paginateWithCategory(
        ${pageNumbers}, ${currentPage}, ${totalPages},
        '/tours', ${keyword}, ${categoryId})}"/>

</th:block>
</body>
</html>
