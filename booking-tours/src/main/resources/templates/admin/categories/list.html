<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(pageTitle='Category Management', content=~{::pageContent}, extraHead=~{}, extraScripts=~{::extraScripts})}">
<body>
<th:block th:fragment="pageContent">
    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i class="bi bi-tags-fill me-2 text-success"></i>Category Management
        </h3>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/categories/new}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-circle me-1"></i>New Category
            </a>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Search form -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/admin/categories}" method="get" class="d-flex gap-2">
                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search by category name…"
                       th:value="${keyword}"/>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-search me-1"></i>Search
                </button>
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle me-1"></i>Clear
                </a>
            </form>
        </div>
    </div>

    <!-- Categories table -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <span class="fw-semibold">
                Total: <strong th:text="${categoryPage.totalElements}">0</strong> categories
            </span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3" style="width:60px">#</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th class="text-center" style="width:160px">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${categoryPage.empty}">
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No categories found.
                        </td>
                    </tr>
                    <tr th:each="cat, stat : ${categoryPage.content}">
                        <td class="ps-3 text-muted small"
                            th:text="${categoryPage.number * categoryPage.size + stat.index + 1}">1</td>
                        <td>
                            <span class="fw-semibold" th:text="${cat.name}">Category Name</span>
                        </td>
                        <td class="text-muted small"
                            th:text="${cat.description != null ? cat.description : '—'}">—</td>
                        <td class="text-center">
                            <div class="d-flex gap-1 justify-content-center">
                                <!-- Edit -->
                                <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}"
                                   class="btn btn-sm btn-outline-primary"
                                   title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <!-- Delete -->
                                <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}"
                                      method="post"
                                      onsubmit="return confirmDelete(this)">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Pagination -->
        <th:block th:replace="~{layout/pagination :: paginate(
            ${pageNumbers}, ${currentPage}, ${totalPages},
            '/admin/categories', ${keyword})}"/>
    </div>
</th:block>

<th:block th:fragment="extraScripts">
    <script>
        function confirmDelete(form) {
            return confirm('Are you sure you want to delete this category? This action cannot be undone.');
        }
    </script>
</th:block>
</body>
</html>
