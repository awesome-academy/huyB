<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(pageTitle='403 - Access Denied', content=~{::mainContent},  ~{::extra-head}, ~{::extra-scripts})}">
<body>
<th:block th:fragment="mainContent">
    <div class="text-center py-5">
        <i class="bi bi-shield-lock-fill text-danger" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold text-danger mt-3">403</h1>
        <h4 class="mb-3">Access Denied</h4>
        <p class="text-muted mb-4" th:text="${message} ?: 'You do not have permission to access this page.'"></p>
        <a th:href="@{/}" class="btn btn-primary">
            <i class="bi bi-house-fill me-2"></i>Back to Home
        </a>
    </div>
</th:block>
</body>
</html>
