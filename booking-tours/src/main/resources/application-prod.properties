# ============================================================
# PROD profile  —  active khi SPRING_PROFILES_ACTIVE=prod
# Tất cả thông tin nhạy cảm đọc từ biến môi trường (không hardcode).
# ============================================================

# ========================
# DataSource — PostgreSQL production
# Đặt các biến môi trường trên server:
#   DB_URL      = jdbc:postgresql://<host>:5432/<dbname>
#   DB_USERNAME = <db_user>
#   DB_PASSWORD = <db_password>
# ========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================
# Flyway — bật migration trên production
# out-of-order=false: đảm bảo migration chạy đúng thứ tự version
# ========================
spring.flyway.enabled=true
spring.flyway.out-of-order=false

# ========================
# JPA / Hibernate — tắt log SQL để giảm noise & tránh lộ query
# ========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========================
# Thymeleaf — bật cache để tăng hiệu năng
# ========================
spring.thymeleaf.cache=true

# ========================
# OAuth2 — Google (đặt biến môi trường trên server)
#   GOOGLE_CLIENT_ID     = <client_id>
#   GOOGLE_CLIENT_SECRET = <client_secret>
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ========================
# JWT - secret đọc từ biến môi trường (KHÔNG hardcode ở prod)
#   JWT_SECRET = <base64-encoded key >= 256 bit>
# Sinh key mạnh: openssl rand -base64 32
# cookie-secure=true vì production chạy HTTPS
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.cookie-secure=true

# ========================
# Logging - chỉ ghi WARNING trở lên, tránh lộ thông tin
# ========================
logging.level.root=WARN
logging.level.com.sunasterisk.bookingtours=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Ghi log ra file để dễ theo dõi trên server
logging.file.name=/var/log/booking-tours/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=300MB

# ========================
# Server — nén response để giảm bandwidth
# ========================
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024
