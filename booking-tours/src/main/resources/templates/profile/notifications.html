<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          'Notifications',
          ~{::content},
          ~{},
          ~{})}">
<body>
<th:block th:fragment="content">
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"><i class="bi bi-bell me-2"></i>Notifications</h4>
            <form th:action="@{/profile/notifications/mark-read}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-check2-all me-1"></i>Mark all read
                </button>
            </form>
        </div>

        <div th:if="${notifications.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-bell-slash display-4 d-block mb-3"></i>
            <p>No notifications yet.</p>
        </div>

        <div th:unless="${notifications.isEmpty()}" class="list-group shadow-sm">
            <div th:each="notif : ${notifications.content}"
                 th:classappend="${!notif.isRead} ? 'list-group-item-light' : ''"
                 class="list-group-item list-group-item-action px-4 py-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <!-- type icon -->
                            <span th:switch="${notif.type.name()}">
                                <i th:case="'BOOKING_CONFIRMED'" class="bi bi-check-circle-fill text-success"></i>
                                <i th:case="'BOOKING_CANCELLED'" class="bi bi-x-circle-fill text-danger"></i>
                                <i th:case="'PAYMENT_CONFIRMED'" class="bi bi-credit-card-fill text-primary"></i>
                                <i th:case="'TOUR_PROMOTION'" class="bi bi-megaphone-fill text-warning"></i>
                                <i th:case="*" class="bi bi-info-circle-fill text-secondary"></i>
                            </span>
                            <strong th:text="${notif.title}">Title</strong>
                            <span th:unless="${notif.isRead}"
                                  class="badge bg-primary rounded-pill" style="font-size:0.6rem;">New</span>
                        </div>
                        <p class="mb-1 text-muted small" th:text="${notif.message}">Message</p>
                    </div>
                    <small class="text-muted text-nowrap ms-3"
                           th:text="${#temporals.format(notif.createdAt, 'dd MMM HH:mm')}">time</small>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${notifications.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li th:classappend="${notifications.first} ? 'disabled'" class="page-item">
                    <a class="page-link"
                       th:href="@{/profile/notifications(page=${currentPage - 1})}">Previous</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, notifications.totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'" class="page-item">
                    <a class="page-link" th:href="@{/profile/notifications(page=${i})}"
                       th:text="${i + 1}">1</a>
                </li>
                <li th:classappend="${notifications.last} ? 'disabled'" class="page-item">
                    <a class="page-link"
                       th:href="@{/profile/notifications(page=${currentPage + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</th:block>
</body>
</html>
