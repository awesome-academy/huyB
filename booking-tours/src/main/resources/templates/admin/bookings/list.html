<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(pageTitle='Booking Management', content=~{::pageContent}, extraHead=~{}, extraScripts=~{::extraScripts})}">
<body>
<th:block th:fragment="pageContent">

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i class="bi bi-calendar-check-fill me-2 text-danger"></i>Booking Management
        </h3>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/bookings/export(keyword=${keyword},status=${status},fromDate=${fromDate},toDate=${toDate})}"
               class="btn btn-success btn-sm">
                <i class="bi bi-file-earmark-excel me-1"></i>Export Excel
            </a>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Filter bar -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/admin/bookings}" method="get" class="row g-2 align-items-end">

                <!-- Keyword search -->
                <div class="col-12 col-md-4">
                    <label class="form-label small fw-semibold mb-1">Search</label>
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Customer name, email or tour title…"
                           th:value="${keyword}"/>
                </div>

                <!-- Status filter -->
                <div class="col-6 col-md-3">
                    <label class="form-label small fw-semibold mb-1">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All statuses</option>
                        <option value="PENDING"
                                th:selected="${status != null && status.name() == 'PENDING'}">PENDING</option>
                        <option value="CONFIRMED"
                                th:selected="${status != null && status.name() == 'CONFIRMED'}">CONFIRMED</option>
                        <option value="CANCELLED"
                                th:selected="${status != null && status.name() == 'CANCELLED'}">CANCELLED</option>
                        <option value="COMPLETED"
                                th:selected="${status != null && status.name() == 'COMPLETED'}">COMPLETED</option>
                    </select>
                </div>

                <!-- Date range: from -->
                <div class="col-6 col-md-2">
                    <label class="form-label small fw-semibold mb-1">From</label>
                    <input type="date"
                           name="fromDate"
                           class="form-control"
                           th:value="${fromDate}"/>
                </div>

                <!-- Date range: to -->
                <div class="col-6 col-md-2">
                    <label class="form-label small fw-semibold mb-1">To</label>
                    <input type="date"
                           name="toDate"
                           class="form-control"
                           th:value="${toDate}"/>
                </div>

                <!-- Buttons -->
                <div class="col-6 col-md-1 d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-3 w-100">
                        <i class="bi bi-search"></i>
                    </button>
                    <a th:href="@{/admin/bookings}" class="btn btn-outline-secondary px-3 w-100">
                        <i class="bi bi-x-circle"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Stats summary row -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <div class="rounded-circle bg-warning bg-opacity-10 d-flex align-items-center justify-content-center"
                         style="width:44px;height:44px;flex-shrink:0">
                        <i class="bi bi-clock-history text-warning fs-5"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Pending</div>
                        <div class="fw-bold fs-5" th:text="${totalPending}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center"
                         style="width:44px;height:44px;flex-shrink:0">
                        <i class="bi bi-check-circle text-success fs-5"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Confirmed</div>
                        <div class="fw-bold fs-5" th:text="${totalConfirmed}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <div class="rounded-circle bg-danger bg-opacity-10 d-flex align-items-center justify-content-center"
                         style="width:44px;height:44px;flex-shrink:0">
                        <i class="bi bi-x-circle text-danger fs-5"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Cancelled</div>
                        <div class="fw-bold fs-5" th:text="${totalCancelled}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center"
                         style="width:44px;height:44px;flex-shrink:0">
                        <i class="bi bi-cash-stack text-primary fs-5"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Completed (VND)</div>
                        <div class="fw-bold fs-5"
                             th:text="${#numbers.formatDecimal(totalCompleted, 1, 'COMMA', 0, 'POINT')}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bookings table -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <span class="fw-semibold">
                Total: <strong th:text="${bookingPage.totalElements}">0</strong> bookings
            </span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3" style="width:50px">#</th>
                        <th>Customer</th>
                        <th>Tour</th>
                        <th class="text-end">Amount (VND)</th>
                        <th class="text-center">Guests</th>
                        <th>Booked At</th>
                        <th class="text-center">Status</th>
                        <th class="text-center" style="width:140px">Actions</th>
                    </tr>
                    </thead>
                    <tbody>

                    <!-- Empty state -->
                    <tr th:if="${bookingPage.empty}">
                        <td colspan="9" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No bookings found.
                        </td>
                    </tr>

                    <!-- Booking rows -->
                    <tr th:each="booking, stat : ${bookingPage.content}">

                        <!-- Row number -->
                        <td class="ps-3 text-muted small"
                            th:text="${bookingPage.number * bookingPage.size + stat.index + 1}">1</td>

                        <!-- Customer info -->
                        <td>
                            <span class="fw-semibold" th:text="${booking.user.fullName}">John Doe</span>
                            <br/>
                            <small class="text-muted">
                                <i class="bi bi-envelope me-1"></i>
                                <span th:text="${booking.user.email}">email@example.com</span>
                            </small>
                        </td>

                        <!-- Tour title + departure date -->
                        <td>
                            <span th:text="${booking.tour.title}">Tour Title</span>
                            <br/>
                            <small class="text-muted">
                                <i class="bi bi-calendar3 me-1"></i>
                                <span th:text="${booking.tour.departureDate != null ?
                                    #temporals.format(booking.tour.departureDate, 'dd/MM/yyyy') : '—'}">—</span>
                            </small>
                        </td>

                        <!-- Total price -->
                        <td class="text-end fw-semibold"
                            th:text="${#numbers.formatDecimal(booking.totalPrice, 1, 'COMMA', 0, 'POINT')}">0</td>

                        <!-- Max participants -->
                        <td class="text-center" th:text="${booking.tour.maxParticipants}">1</td>

                        <!-- Booked at datetime -->
                        <td th:text="${booking.createdAt != null ?
                            #temporals.format(booking.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">—</td>

                        <!-- Booking status badge -->
                        <td class="text-center">
                            <span th:switch="${booking.status?.name()}">
                                <span th:case="'PENDING'"   class="badge bg-warning text-dark">PENDING</span>
                                <span th:case="'CONFIRMED'" class="badge bg-success">CONFIRMED</span>
                                <span th:case="'CANCELLED'" class="badge bg-danger">CANCELLED</span>
                                <span th:case="'COMPLETED'" class="badge bg-primary">COMPLETED</span>
                                <span th:case="*"           class="badge bg-secondary">UNKNOWN</span>
                            </span>
                        </td>

                        <!-- Actions -->
                        <td class="text-center">
                            <div class="d-flex gap-1 justify-content-center">

                                <!-- View detail -->
                                <a th:href="@{/admin/bookings/{id}(id=${booking.id})}"
                                   class="btn btn-sm btn-outline-secondary"
                                   title="View Detail">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <!-- Confirm payment: only for PENDING bookings -->
                                <form th:if="${booking.status?.name() == 'PENDING'}"
                                      th:action="@{/admin/bookings/{id}/confirm(id=${booking.id})}"
                                      method="post"
                                      onsubmit="return confirmPayment(this)">
                                    <button type="submit"
                                            class="btn btn-sm btn-success"
                                            title="Confirm Payment">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                </form>

                                <!-- Cancel: only for PENDING or CONFIRMED bookings -->
                                <form th:if="${booking.status?.name() == 'PENDING' or booking.status?.name() == 'CONFIRMED'}"
                                      th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}"
                                      method="post"
                                      onsubmit="return confirmCancel(this)">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            title="Cancel Booking">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination — reuse the same pagination fragment as tours -->
        <th:block th:replace="~{layout/pagination :: paginate(
            ${pageNumbers}, ${currentPage}, ${totalPages},
            '/admin/bookings', ${keyword})}"/>
    </div>
</th:block>

<th:block th:fragment="extraScripts">
    <script>
        function confirmPayment(form) {
            return confirm('Confirm payment for this booking?\nStatus will be changed to CONFIRMED.');
        }

        function confirmCancel(form) {
            return confirm('Are you sure you want to cancel this booking?\nThis action cannot be undone.');
        }
    </script>
</th:block>
</body>
</html>
