spring.application.name=booking-tours
server.port=8080

# ========================
# Active Profile
# Override bằng biến môi trường:  SPRING_PROFILES_ACTIVE=prod
# hoặc JVM arg:                  -Dspring.profiles.active=prod
# ========================
spring.profiles.active=dev

# ========================
# JPA / Hibernate
# ddl-auto=none để không tự động tạo/điều chỉnh schema, dùng schema.sql để quản lý schema
# open-in-view=false để tránh lỗi LazyInitializationException khi trả về entity đã bị đóng session
# dialect giúp Hibernate sinh SQL phù hợp với PostgreSQL, tránh lỗi và tối ưu hiệu suất
# ========================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Flyway — Database Migration
# Flyway tự động chạy các script trong db/migration khi khởi động
# baseline-on-migrate: cho phép migrate trên DB đã tồn tại (không có flyway_schema_history)
# ========================
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ========================
# Thymeleaf — cấu hình chung
# cache được override theo profile (false ở dev, true ở prod)
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ========================
# JWT
# secret: Base64-encoded key >= 256 bit (thay bằng giá trị thực khi deploy)
# expiration-ms: 1 ngày = 86400000 ms
# ========================
app.jwt.secret=c3VuQm9va2luZ1RvdXJzU2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnQyMDI2IQ==
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=JWT_TOKEN
