<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(pageTitle='404 - Not Found', content=~{::mainContent})}">
<body>
<th:block th:fragment="mainContent">
    <div class="text-center py-5">
        <i class="bi bi-compass-fill text-warning" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold text-warning mt-3">404</h1>
        <h4 class="mb-3">Page Not Found</h4>
        <p class="text-muted mb-4" th:text="${message} ?: 'The page you are looking for does not exist or has been removed.'"></p>
        <a th:href="@{/}" class="btn btn-primary me-2">
            <i class="bi bi-house-fill me-2"></i>Back to Home
        </a>
        <a th:href="@{/tours}" class="btn btn-outline-primary">
            <i class="bi bi-map me-2"></i>View Tours
        </a>
    </div>
</th:block>
</body>
</html>
