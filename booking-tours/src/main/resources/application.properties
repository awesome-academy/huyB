spring.application.name=booking-tours
server.port=8080

# ========================
# DataSource — PostgreSQL
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_tours
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ddl-auto=none để không tự động tạo/điều chỉnh schema, dùng schema.sql để quản lý schema
# show-sql=true để hiển thị SQL trong logs, format_sql=true để dễ đọc, dialect để tối ưu cho PostgreSQL
# dialect giúp Hibernate sinh SQL phù hợp với PostgreSQL, tránh lỗi và tối ưu hiệu suất
# ========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# SQL Init — schema.sql + data.sql
# init.mode=always để luôn chạy các script khi ứng dụng khởi động, bất kể datasource đã tồn tại hay chưa
# schema-locations và data-locations để chỉ định vị trí của các file SQL,
# defer-datasource-initialization=true để đảm bảo chạy SQL init sau khi Hibernate khởi tạo xong
# ========================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.defer-datasource-initialization=true

# ========================
# Thymeleaf
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ========================
# OAuth2 — Google (điền Client ID/Secret thực tế)
# ========================
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ========================
# Logging
# ========================
logging.level.com.sunasterisk.bookingtours=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
