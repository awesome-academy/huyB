# ============================================================
# BASE configuration — áp dụng cho tất cả các profile
# Giá trị nhạy cảm và override theo môi trường nằm ở:
#   application-dev.properties   (SPRING_PROFILES_ACTIVE=dev)
#   application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================

# ========================
# Application
# ========================
spring.application.name=booking-tours
spring.profiles.active=dev

# ========================
# Server
# ========================
server.port=8080

# ========================
# DataSource
# url / username / password được định nghĩa theo từng profile
# ========================
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ddl-auto=none  → dùng Flyway quản lý schema, không để Hibernate tự sửa
# open-in-view=false → tránh LazyInitializationException
# dialect → sinh SQL tối ưu cho PostgreSQL
# show-sql / format_sql được override theo từng profile
# ========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Flyway — Database Migration
# Flyway tự động chạy các script trong db/migration khi khởi động
# Script SQL nằm trong classpath:db/migration
# baseline-on-migrate: cho phép migrate trên DB đã có sẵn
# enabled / out-of-order được override theo từng profile
# ========================
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ========================
# Thymeleaf
# cache được override theo từng profile (false ở dev, true ở prod)
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# App — Custom Config
# ========================
app.upload.dir=uploads

# JWT
# secret được định nghĩa riêng theo từng profile
# expiration-ms: 1 ngày = 86_400_000 ms
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=JWT_TOKEN
