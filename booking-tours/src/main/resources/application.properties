spring.application.name=booking-tours
server.port=8080

# ========================
# Active Profile
# Override bằng biến môi trường:  SPRING_PROFILES_ACTIVE=prod
# hoặc JVM arg:                  -Dspring.profiles.active=prod
# ========================
spring.profiles.active=dev

# ========================
# JPA / Hibernate — cấu hình chung
# dialect giúp Hibernate sinh SQL phù hợp với PostgreSQL
# ddl-auto=none: không tự tạo/sửa schema, dùng schema.sql để quản lý
# ========================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# ========================
# SQL Init — schema.sql + data.sql
# init.mode được override theo profile (always ở dev, never ở prod)
# ========================
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ========================
# Thymeleaf — cấu hình chung
# cache được override theo profile (false ở dev, true ở prod)
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
