# ============================================================
# PROD profile  —  active khi SPRING_PROFILES_ACTIVE=prod
# Tất cả thông tin nhạy cảm đọc từ biến môi trường (không hardcode).
# ============================================================

# ========================
# DataSource — MySQL production
# Đặt các biến môi trường trên server:
#   DB_URL      = jdbc:mysql://<host>:3306/<dbname>?useSSL=true&serverTimezone=UTC
#   DB_USERNAME = <db_user>
#   DB_PASSWORD = <db_password>
# ========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================
# Flyway — bật migration trên production
# out-of-order=false: đảm bảo migration chạy đúng thứ tự version
# ========================
spring.flyway.enabled=true
spring.flyway.out-of-order=false

# ========================
# JPA / Hibernate — tắt log SQL để giảm noise & tránh lộ query
# ========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========================
# Thymeleaf — bật cache để tăng hiệu năng
# ========================
spring.thymeleaf.cache=true

# ========================
# Springdoc / Swagger UI — TẮT hoàn toàn ở prod
# ========================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ========================
# OAuth2 — Google (đặt biến môi trường trên server)
#   GOOGLE_CLIENT_ID     = <client_id>
#   GOOGLE_CLIENT_SECRET = <client_secret>
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 — Facebook + Twitter (đặt biến môi trường trên server)
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
spring.security.oauth2.client.registration.twitter.client-id=${TWITTER_CLIENT_ID}
spring.security.oauth2.client.registration.twitter.client-secret=${TWITTER_CLIENT_SECRET}
spring.security.oauth2.client.registration.twitter.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.scope=tweet.read,users.read,offline.access
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=data

# ========================
# JWT - secret đọc từ biến môi trường (KHÔNG hardcode ở prod)
#   JWT_SECRET = <base64-encoded key >= 256 bit>
# Sinh key mạnh: openssl rand -base64 32
# cookie-secure=true vì production chạy HTTPS
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.cookie-secure=true

# ========================
# Logging - chỉ ghi WARNING trở lên, tránh lộ thông tin
# ========================
logging.level.root=WARN
logging.level.com.sunasterisk.bookingtours=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Ghi log ra file để dễ theo dõi trên server
logging.file.name=/var/log/booking-tours/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=300MB

# ========================
# ActiveMQ — đặt biến môi trường trên server:
#   ACTIVEMQ_BROKER_URL = tcp://<host>:61616
# ========================
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL}

# ========================
# RabbitMQ — đặt biến môi trường trên server:
#   RABBITMQ_HOST     = <host>
#   RABBITMQ_USERNAME = <user>
#   RABBITMQ_PASSWORD = <password>
# ========================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ========================
# Reverse proxy — tin cậy X-Forwarded-* từ proxy phía trước (nginx/LB)
# Bắt buộc để request.getRemoteAddr() trả về IP thật của client thay vì IP proxy.
# Nếu không có, mọi client dùng chung IP proxy → rate-limit đăng nhập (LoginAttemptService)
# gom tất cả về một key "proxyIP|email" → kẻ tấn công có thể khoá tài khoản victim.
# ========================
server.forward-headers-strategy=framework

# ========================
# Server — nén response để giảm bandwidth
# ========================
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024
