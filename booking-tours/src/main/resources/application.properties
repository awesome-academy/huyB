spring.application.name=booking-tours
server.port=8080

# ========================
# Active Profile
# Override bằng biến môi trường:  SPRING_PROFILES_ACTIVE=prod
# hoặc JVM arg:                  -Dspring.profiles.active=prod
# ========================
spring.profiles.active=dev

# ========================
# JPA / Hibernate — cấu hình chung
# dialect giúp Hibernate sinh SQL phù hợp với PostgreSQL
# ddl-auto=none: không tự tạo/sửa schema, dùng schema.sql để quản lý
# ========================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Flyway — Database Migration
# Flyway tự động chạy các script trong db/migration khi khởi động
# baseline-on-migrate: cho phép migrate trên DB đã tồn tại (không có flyway_schema_history)
# ========================
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ========================
# Thymeleaf — cấu hình chung
# cache được override theo profile (false ở dev, true ở prod)
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
