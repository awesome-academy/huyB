# ============================================================
# BASE configuration — áp dụng cho tất cả các profile
# Giá trị nhạy cảm và override theo môi trường nằm ở:
#   application-dev.properties   (SPRING_PROFILES_ACTIVE=dev)
#   application-prod.properties  (SPRING_PROFILES_ACTIVE=prod)
# ============================================================

# ========================
# Application
# ========================
spring.application.name=booking-tours
# spring.profiles.active KHÔNG được set ở đây.
# Hãy set profile qua biến môi trường hoặc JVM arg ở từng môi trường triển khai:
#   - Biến môi trường : SPRING_PROFILES_ACTIVE=prod
#   - JVM arg         : -Dspring.profiles.active=prod
#   - IDE (IntelliJ)  : Run/Debug Configuration → Active Profiles = dev

# ========================
# Server
# ========================
server.port=8080

# ========================
# DataSource
# url / username / password được định nghĩa theo từng profile
# ========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ddl-auto=none      → dùng Flyway quản lý schema, không để Hibernate tự sửa
# open-in-view=false → TẮT Open Session in View: Hibernate session bị đóng sau
#                      khi thoát khỏi tầng service, KHÔNG còn mở đến tận view/controller.
#                      Mục đích: buộc fetch đầy đủ dữ liệu bên trong transaction ở
#                      tầng service, tránh các query ẩn không kiểm soát được.
#                      Lưu ý: truy cập lazy relation ngoài transaction (ở controller
#                      hoặc template) sẽ ném LazyInitializationException — đây là
#                      hành vi có chủ đích để phát hiện sớm vấn đề fetching strategy.
# dialect            → sinh SQL tối ưu cho MySQL
# show-sql / format_sql được override theo từng profile
# ========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Flyway — Database Migration
# Flyway tự động chạy các script trong db/migration khi khởi động
# Script SQL nằm trong classpath:db/migration
# baseline-on-migrate: cho phép migrate trên DB đã có sẵn
# enabled / out-of-order được override theo từng profile
# ========================
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ========================
# Thymeleaf
# cache được override theo từng profile (false ở dev, true ở prod)
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# ActiveMQ — trusted packages (dùng chung mọi profile)
# Giới hạn class được phép deserialize qua JMS, ngăn tấn công deserialization.
# ========================
spring.activemq.packages.trusted=com.sunasterisk.bookingtours.messaging.activemq,com.sunasterisk.bookingtours.entity,java.lang,java.util

# ========================
# App — Custom Config
# ========================
app.upload.dir=uploads

# JWT
# secret được định nghĩa riêng theo từng profile
# expiration-ms: 1 ngày = 86_400_000 ms
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=JWT_TOKEN


# ========================
# SOAP
# ========================
# URL của SOAP currency endpoint — override trong application-dev/prod.properties khi cần
soap.currency.url=http://localhost:8080/soap
