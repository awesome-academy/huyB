<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(pageTitle='500 - Internal Server Error', content=~{::mainContent})}">
<body>
<th:block th:fragment="mainContent">
    <div class="text-center py-5">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold text-danger mt-3">500</h1>
        <h4 class="mb-3">Internal Server Error</h4>
        <p class="text-muted mb-2" th:text="${message} ?: 'An error occurred. Please try again later.'"></p>
        <p class="text-muted small" th:if="${error}" th:text="${error}"></p>
        <a th:href="@{/}" class="btn btn-primary">
            <i class="bi bi-house-fill me-2"></i>Back to Home
        </a>
    </div>
</th:block>
</body>
</html>
