<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(pageTitle='Reviews', content=~{::pageContent}, extraHead=~{}, extraScripts=~{})}">
<body>
<th:block th:fragment="pageContent">

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Reviews
        </h3>
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted small">
                <strong th:text="${reviewPage.totalElements}">0</strong> review(s)
            </span>
            <a sec:authorize="isAuthenticated()"
               th:href="@{/reviews/new}"
               class="btn btn-primary btn-sm">
                <i class="bi bi-pencil-square me-1"></i>Write Review
            </a>
        </div>
    </div>

    <!-- Type filter tabs -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-2 px-3">
            <ul class="nav nav-pills gap-1 flex-wrap">
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${reviewType == null} ? 'active' : ''"
                       th:href="@{/reviews}">
                        <i class="bi bi-grid me-1"></i>All
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${reviewType != null and reviewType.name() == 'PLACE'} ? 'active' : ''"
                       th:href="@{/reviews(reviewType='PLACE')}">
                        <i class="bi bi-geo-alt me-1"></i>Place
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${reviewType != null and reviewType.name() == 'FOOD'} ? 'active' : ''"
                       th:href="@{/reviews(reviewType='FOOD')}">
                        <i class="bi bi-cup-hot me-1"></i>Food
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${reviewType != null and reviewType.name() == 'NEWS'} ? 'active' : ''"
                       th:href="@{/reviews(reviewType='NEWS')}">
                        <i class="bi bi-newspaper me-1"></i>News
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${reviewPage.empty}" class="text-center py-5">
        <i class="bi bi-journal-x display-4 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No reviews found</h5>
        <p class="text-muted small">Be the first to write one!</p>
        <a sec:authorize="isAuthenticated()" th:href="@{/reviews/new}" class="btn btn-primary mt-2">
            <i class="bi bi-pencil-square me-1"></i>Write Review
        </a>
        <a sec:authorize="isAnonymous()" th:href="@{/auth/login}" class="btn btn-outline-primary mt-2">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login to Write
        </a>
    </div>

    <!-- Review cards -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${reviewPage.empty}">
        <div class="col" th:each="review : ${reviewPage.content}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <!-- Type badge -->
                    <div class="mb-2">
                        <span th:switch="${review.type?.name()}"
                              class="badge rounded-pill">
                            <span th:case="'PLACE'" class="badge rounded-pill bg-success">
                                <i class="bi bi-geo-alt me-1"></i>Place
                            </span>
                            <span th:case="'FOOD'" class="badge rounded-pill bg-warning text-dark">
                                <i class="bi bi-cup-hot me-1"></i>Food
                            </span>
                            <span th:case="'NEWS'" class="badge rounded-pill bg-info text-dark">
                                <i class="bi bi-newspaper me-1"></i>News
                            </span>
                        </span>
                    </div>

                    <!-- Title -->
                    <h5 class="card-title fw-bold mb-2 lh-sm">
                        <a th:href="@{/reviews/{id}(id=${review.id})}"
                           class="text-decoration-none text-dark stretched-link"
                           th:text="${review.title}">Review Title</a>
                    </h5>

                    <!-- Content preview -->
                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${#strings.length(review.content) > 150 ? #strings.substring(review.content, 0, 150) + '…' : review.content}">
                        Content preview...
                    </p>

                    <!-- Footer: author + date + likes -->
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-circle text-secondary fs-5"></i>
                            <span class="small text-muted"
                                  th:text="${review.user != null ? review.user.fullName : 'Unknown'}">Author</span>
                        </div>
                        <div class="d-flex align-items-center gap-3 small text-muted">
                            <span>
                                <i class="bi bi-heart-fill text-danger me-1"></i>
                                <span th:text="${review.likesCount}">0</span>
                            </span>
                            <span th:if="${review.createdAt != null}"
                                  th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy')}">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4" th:if="${totalPages > 1}">
        <nav aria-label="Page navigation">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/reviews(page=${currentPage - 1}, reviewType=${reviewType})}"
                       aria-label="Previous">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <th:block th:each="p : ${pageNumbers}">
                    <li th:if="${p == -1}" class="page-item disabled">
                        <span class="page-link px-2">…</span>
                    </li>
                    <li th:if="${p != -1}" class="page-item"
                        th:classappend="${p == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/reviews(page=${p}, reviewType=${reviewType})}"
                           th:text="${p + 1}">1</a>
                    </li>
                </th:block>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/reviews(page=${currentPage + 1}, reviewType=${reviewType})}"
                       aria-label="Next">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</th:block>
</body>
</html>
