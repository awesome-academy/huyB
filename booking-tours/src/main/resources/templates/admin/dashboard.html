<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(pageTitle='Admin Dashboard', content=~{::dashboardContent}, extraHead=~{}, extraScripts=~{})}">
<body>
<th:block th:fragment="dashboardContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i class="bi bi-speedometer2 me-2 text-primary"></i>Admin Dashboard
        </h3>
        <span class="text-muted">
            Welcome, <strong sec:authentication="name"></strong>
        </span>
    </div>

    <!-- Stats cards -->
    <div class="row g-4">
        <!-- Total Users -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-people-fill fs-2 text-primary"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-1 small">Total Users</p>
                        <h4 class="fw-bold mb-0" th:text="${stats.totalUsers}">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Total Tours -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-success bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-map-fill fs-2 text-success"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-1 small">Total Tours</p>
                        <h4 class="fw-bold mb-0" th:text="${stats.totalTours}">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bookings Today -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-calendar-check-fill fs-2 text-warning"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-1 small">Bookings Today</p>
                        <h4 class="fw-bold mb-0" th:text="${stats.bookingsToday}">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Revenue This Month -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-cash-coin fs-2 text-danger"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-1 small">Revenue This Month</p>
                        <h4 class="fw-bold mb-0"
                            th:text="${#numbers.formatDecimal(stats.revenueThisMonth, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick navigation -->
    <div class="row g-3 mt-2">
        <div class="col-md-3">
            <a th:href="@{/admin/users}" class="card border-0 shadow-sm text-decoration-none h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-people-fill fs-4 text-primary"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-0 small">Manage</p>
                        <span class="fw-semibold text-dark">Users</span>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/admin/categories}" class="card border-0 shadow-sm text-decoration-none h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-success bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-tags-fill fs-4 text-success"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-0 small">Manage</p>
                        <span class="fw-semibold text-dark">Categories</span>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/admin/tours}" class="card border-0 shadow-sm text-decoration-none h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-map-fill fs-4 text-warning"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-0 small">Manage</p>
                        <span class="fw-semibold text-dark">Tours</span>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/admin/bookings}" class="card border-0 shadow-sm text-decoration-none h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-calendar-check-fill fs-4 text-danger"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-0 small">Manage</p>
                        <span class="fw-semibold text-dark">Bookings</span>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/admin/reviews}" class="card border-0 shadow-sm text-decoration-none h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-info bg-opacity-10 p-3 rounded-3">
                        <i class="bi bi-journal-text fs-4 text-info"></i>
                    </div>
                    <div>
                        <p class="text-muted mb-0 small">Moderate</p>
                        <span class="fw-semibold text-dark">Reviews</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</th:block>
</body>
</html>
