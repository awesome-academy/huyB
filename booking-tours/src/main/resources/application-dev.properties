# ============================================================
# DEV profile  —  active khi SPRING_PROFILES_ACTIVE=dev  (mặc định)
# File này KHÔNG được đưa lên môi trường production.
# ============================================================

# ========================
# DataSource — PostgreSQL local
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_tours
spring.datasource.username=postgres
spring.datasource.password=postgres

# ========================
# Flyway — bật migration và hiển thị log khi dev
# ========================
spring.flyway.enabled=true
spring.flyway.out-of-order=false

# ========================
# JPA / Hibernate — verbose cho debug
# ========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Thymeleaf — tắt cache để hot-reload template
# ========================
spring.thymeleaf.cache=false

# ========================
# OAuth2 — Google (thay bằng credentials dev thực tế)
# ========================
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ========================
# JWT - secret dành riêng cho dev (hardcode, KHÔNG dùng ở prod)
# Base64-encoded key >= 256 bit
# cookie-secure=false vì localhost chạy HTTP
# ========================
app.jwt.secret=c3VuQm9va2luZ1RvdXJzU2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnQyMDI2IQ==
app.jwt.cookie-secure=false

# ========================
# Logging - verbose để dễ debug
# ========================
logging.level.com.sunasterisk.bookingtours=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=DEBUG
