# ============================================================
# DEV profile  —  active khi SPRING_PROFILES_ACTIVE=dev  (mặc định)
# File này KHÔNG được đưa lên môi trường production.
# ============================================================

# ========================
# DataSource — MySQL local
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/booking_tours?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# ========================
# Flyway — bật migration và hiển thị log khi dev
# ========================
spring.flyway.enabled=true
spring.flyway.out-of-order=false

# ========================
# JPA / Hibernate — verbose cho debug
# ========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Thymeleaf — tắt cache để hot-reload template
# ========================
spring.thymeleaf.cache=false

# ========================
# OAuth2 — Google
# Credentials được đọc từ file .env ở root project (gitignored).
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Import file .env từ root project (optional: không lỗi nếu không có file)
spring.config.import=optional:file:.env[.properties]

# ========================
# JWT - secret dành riêng cho dev (hardcode, KHÔNG dùng ở prod)
# Base64-encoded key >= 256 bit
# cookie-secure=false vì localhost chạy HTTP
# ========================
app.jwt.secret=c3VuQm9va2luZ1RvdXJzU2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnQyMDI2IQ==
app.jwt.cookie-secure=false

# ========================
# Logging - verbose để dễ debug
# ========================
logging.level.com.sunasterisk.bookingtours=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=DEBUG
