# H2 in-memory datasource — overrides profile-specific MySQL config for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use H2 dialect; let Hibernate generate schema from entities
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway — MySQL-specific DDL is incompatible with H2
spring.flyway.enabled=false

# JWT secret for test context (not a real secret)
app.jwt.secret=test-secret-key-for-unit-tests-only-minimum-256-bits-long-padding

# OAuth2 stubs — satisfy ClientRegistrationRepository bean without real credentials
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
